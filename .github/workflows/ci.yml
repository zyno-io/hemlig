name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Resolve Yarn cache directory
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Test release versioning and publication checks
        run: node --test scripts/release.test.mjs
      - name: Lint all workspaces
        run: yarn lint:all
      - name: Test root service and CDK construct
        run: yarn test
      - name: Test workspace packages
        run: yarn test:all
      - name: Package the CDK reference app
        run: yarn build:cdk

  ministack:
    name: MiniStack verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Resolve Yarn cache directory
        id: yarn-cache
        run: echo "path=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.path }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install dependencies
        run: yarn install --immutable
      - name: Start MiniStack
        run: docker compose -f docker-compose.ministack.yml up -d --wait
      - name: Verify DynamoDB, S3, and KMS integration
        run: yarn ministack:verify
      - name: Stop MiniStack
        if: always()
        run: docker compose -f docker-compose.ministack.yml down -v

  controller-image:
    name: Controller image build and publish
    needs: [verify, ministack, helm-chart, release-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hemlig-controller
    steps:
      - uses: actions/checkout@v4
      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "tag=main" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the Node 24 controller image
        run: |
          docker build --pull \
            --file packages/kubernetes-controller/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --tag "$IMAGE:${{ steps.image.outputs.tag }}" \
            .
      - name: Publish the controller image
        if: steps.image.outputs.push == 'true'
        run: docker push "$IMAGE:${{ steps.image.outputs.tag }}"

  helm-chart:
    name: Helm chart validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Lint chart
        run: helm lint packages/kubernetes-controller/chart/hemlig-controller
      - name: Render chart including CRDs
        run: >-
          helm template hemlig-controller
          packages/kubernetes-controller/chart/hemlig-controller
          --namespace hemlig-system
          --include-crds
          > /tmp/hemlig-controller.yaml

  publish-helm-chart:
    name: Publish Helm chart
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, ministack, controller-image, helm-chart, release-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Validate release tag and package chart
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Release tags must start with v, such as v0.1.0." >&2
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tag $GITHUB_REF_NAME is not a Helm-compatible SemVer tag." >&2
            exit 1
          fi
          mkdir -p dist/charts
          helm package packages/kubernetes-controller/chart/hemlig-controller \
            --destination dist/charts \
            --version "$version" \
            --app-version "$GITHUB_REF_NAME"
          {
            echo "version=$version"
            echo "release_tag=hemlig-controller-$version"
            echo "package=dist/charts/hemlig-controller-$version.tgz"
          } >> "$GITHUB_OUTPUT"
      - name: Require charts repository credential
        env:
          CHARTS_REPO_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
        run: |
          if [[ -z "$CHARTS_REPO_TOKEN" ]]; then
            echo "CHARTS_REPO_TOKEN must be a fine-grained token with Contents read/write access to zyno-io/charts." >&2
            exit 1
          fi
      - name: Create immutable charts repository release
        env:
          GH_TOKEN: ${{ secrets.CHARTS_REPO_TOKEN }}
          CHART_PACKAGE: ${{ steps.package.outputs.package }}
          CHART_RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          CHART_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "$CHART_RELEASE_TAG" --repo zyno-io/charts > /dev/null 2>&1; then
            echo "Chart release $CHART_RELEASE_TAG already exists in zyno-io/charts; releases are immutable." >&2
            exit 1
          fi
          gh release create "$CHART_RELEASE_TAG" "$CHART_PACKAGE" \
            --repo zyno-io/charts \
            --title "Hemlig controller $CHART_VERSION" \
            --notes "Published from zyno-io/hemlig Git tag $GITHUB_REF_NAME."

  release-artifacts:
    name: Build and verify release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
    env:
      CI: true
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Validate tag and set package versions for this build
        id: release
        run: node scripts/release.mjs prepare "$RELEASE_TAG"
      - name: Build client, CLI and Pulumi provider
        run: |
          yarn workspace @zyno-io/hemlig-client build
          yarn workspace @zyno-io/hemlig-cli build
          yarn workspace @zyno-io/hemlig-pulumi-provider build
      - name: Pack and verify publishable manifests
        run: node scripts/release.mjs pack "$RELEASE_TAG"
      - name: Dry-run npm publication
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.npm_tag }}
        run: |
          for archive in ./release-artifacts/hemlig-{client,cli,pulumi-provider}.tgz; do
            npm publish "$archive" --dry-run --access public --ignore-scripts --tag "$NPM_DIST_TAG"
          done
      - name: Record package checksums
        run: (cd release-artifacts && sha256sum ./*.tgz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        id: artifacts
        with:
          name: release-artifacts-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, ministack, controller-image, helm-chart, release-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.release-artifacts.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: release-artifacts
      - name: Create release with package archives and checksums
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for asset in release-artifacts/*; do
              cmp "$asset" "$existing/$(basename "$asset")"
            done
            echo "Release $RELEASE_TAG already contains identical assets."
          else
            flags=()
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" release-artifacts/* \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Hemlig $RELEASE_TAG" --generate-notes "${flags[@]}"
          fi

  publish-npm:
    name: Publish client, CLI and Pulumi provider to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [github-release, release-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-artifacts.outputs.artifact-id }}
          merge-multiple: true
          path: release-artifacts
      - name: Publish exact release archives in dependency order
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs publish "$RELEASE_TAG"
