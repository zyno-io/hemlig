# Run Ansible from this directory (the yarn testbed:* scripts do), so these
# paths resolve relative to testbed/.
[defaults]
inventory = inventory.yml
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = false
# Host key checking stays at its default (enabled). Add the VM to known_hosts
# first, for example with ssh-keyscan or a first manual ssh.
