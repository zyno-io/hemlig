openapi: 3.1.0
info:
  title: Hemlig Secrets Delivery API
  version: 0.4.0
  description: |
    Lambda/S3/KMS backed delivery of externally managed secret payloads.
    This contract includes secret control, organizational browsing, and enrolled
    identity certificate lifecycle routes and bounded audit-archive browsing.
    Issuer-root rotation remains intentionally absent.
externalDocs:
  description: Hemlig API reference and compatibility notes
  url: ../docs/api.md
servers:
  - &admin-server
    url: https://{adminFqdn}
    description: Administrator API; JWT required for every operation.
    variables:
      adminFqdn:
        default: admin.example.com
  - &consumer-server
    url: https://{apiFqdn}
    description: Delivery API; mTLS identity required for every operation.
    variables:
      apiFqdn:
        default: api.example.com
tags:
  - name: administrator
    description: Authenticated secret-control mutations.
  - name: consumer
    description: mTLS-authenticated secret delivery and reconciliation.
  - name: agent
    description: mTLS namespace-agent bootstrap, scoped synchronization, and delivery.
paths:
  /v1/bootstrap/redeem:
    post:
      servers: [*admin-server]
      tags: [agent]
      summary: Redeem a one-use bootstrap capability for its pre-scoped AgentGrant
      security: [{ bootstrapCapability: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRedemptionRequest" }
      responses:
        "201":
          description: Active mTLS leaf and AgentGrant scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBootstrapResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/environments:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: List administrator-defined secret and consumer environments
      security: [{ administratorJwt: [] }]
      responses:
        "200":
          description: Environments available for new secrets and consumer enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentListResponse" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Define an environment for secrets and consumer enrollment
      security: [{ administratorJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironmentRequest" }
      responses:
        "201":
          description: Newly defined environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentDefinition" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/audit:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse one UTC day of immutable application audit evidence
      description: |
        Returns up to fifty records in newest-first order. `date` defaults to
        the current UTC day. Supplying `secretId` returns only records whose
        safe target ID exactly matches it. Cursors are opaque, caller- and
        filter-bound, and valid for 15 minutes. Querying the archive is itself
        audited.
      security: [{ administratorJwt: [] }]
      parameters:
        - name: date
          in: query
          required: false
          schema:
            { type: string, format: date, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: secretId
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
      responses:
        "200":
          description: Bounded immutable evidence page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/agent-grants:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create a pending, path-scoped AgentGrant for a new consumer identity
      security: [{ administratorJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentGrantRequest" }
      responses:
        "201":
          description: Pending AgentGrant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGrant" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/agent-grants/{grantId}/bootstrap-capabilities:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Issue the one plaintext bootstrap capability for a pending grant
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/GrantId"
      responses:
        "201":
          description: Capability shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapCapability" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/secrets:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse secret control metadata by environment, path prefix, and exact tags
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/PathPrefix"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated organizational catalog; never includes payloads or ACLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretCatalogPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create an empty secret and its initial ACL
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read secret control metadata and ACL without loading a payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Update metadata and/or ACL without decrypting the payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretRequest"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/tree:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse the secret catalog as a folder tree below one path prefix
      description: |
        Every admin request writes three audit objects into a seven-year
        Object Lock Compliance archive, so letting a console page through a
        subtree one folder at a time -- one request per folder opened --
        would multiply that archive write for no operational benefit. This
        route paginates the catalog-path index internally instead and
        returns one bounded page: the distinct immediate child folders below
        pathPrefix (each with a recursive secret count), plus any secrets
        that live directly at pathPrefix.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/PathPrefix"
      responses:
        "200":
          description: One bounded, complete-or-truncated tree page; never a cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretTreePage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/folders:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create an explicit, empty folder record
      description: |
        Creates exactly one record at `path`. Intermediate segments (e.g.
        `a` and `a/b` when creating `a/b/c`) are never materialised as
        separate records: GET /v1/admin/secrets/tree already derives every
        intermediate segment from the paths it observes, so creating them
        here too would be a second source of truth for the same folder.
      security: [{ administratorJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFolderRequest" }
      responses:
        "201":
          description: Newly created folder record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FolderDefinition" }
        default:
          $ref: "#/components/responses/Error"
    delete:
      servers: [*admin-server]
      tags: [administrator]
      summary: Delete an explicit folder record
      description: |
        Never touches a secret. Returns 409 when any secret's path equals
        `path` exactly or is nested beneath it: deleting the record would
        not remove the folder from the tree, since it would still be
        derived from that secret. Returns 404 when no folder record exists
        at exactly `path`, even if the tree still shows it as a derived
        folder -- there is nothing to delete.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/FolderPath"
      responses:
        "204":
          description: Folder record deleted
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse consumers in one environment
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated consumer directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerListPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Enroll a consumer CSR and receive an API client certificate
      description: Hemlig creates one deployment-wide issuing root, publishes that root to the mTLS truststore, and signs the CSR's public key with a client-auth leaf containing the consumer SPIFFE URI SAN.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "201":
          description: Active enrollment after API Gateway confirms the version-pinned truststore
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ConsumerProvisioningResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read one consumer profile and active API identity count
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
      responses:
        "200":
          description: Consumer management profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerDetail" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/api-identities:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse a consumer's public API identity certificates
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated newest-first API identity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityListPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Sign an overlapping API client-certificate CSR
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiIdentityRequest" }
      responses:
        "201":
          description: Active API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/api-identities/{apiFingerprint}:
    delete:
      servers: [*admin-server]
      tags: [administrator]
      summary: Revoke an API leaf identity immediately
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/ApiFingerprint"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/payload:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Decrypt and read the current secret payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: Current decrypted payload and immutable revision IDs
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretReadResponse" }
        default:
          $ref: "#/components/responses/Error"
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create a fresh encrypted payload and control revision
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/Payload"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/revisions:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read newest-first secret control revision history without payloads
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: At most 500 newest control revisions; no payload or object URL is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretRevisionPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/issuer:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read public issuing-root and current truststore status
      security: [{ administratorJwt: [] }]
      responses:
        "200":
          description: Public issuer status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Deliberately provision the Hemlig issuing root before any consumer enrolls
      description: |
        The issuing root is otherwise created lazily inside the first
        enrollment. This route lets an operator provision it deliberately so
        the truststore anchor exists and can be distributed in advance. It
        shares its creation logic with the lazy enrollment path, so the two
        can never diverge, and creation is race-safe: calling this
        repeatedly or concurrently is safe without an additional lock.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The issuing root already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        "201":
          description: This call created the issuing root
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets/{secretId}:
    get:
      servers: [*consumer-server]
      tags: [consumer]
      summary: Read an authorized payload over mTLS
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Decrypted payload
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretReadResponse" }
        "304":
          description: The control revision is unchanged.
          headers:
            ETag:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /v1/changes:
    get:
      servers: [*consumer-server]
      tags: [consumer]
      summary: Return the caller consumer's current paginated access snapshot
      security: [{ consumerMtls: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current change page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        default:
          $ref: "#/components/responses/Error"
  /v1/agent/config:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Return the active AgentGrant and exact private AWS IoT topic
      security: [{ consumerMtls: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfig" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets:
    post:
      servers: [*consumer-server]
      tags: [agent]
      summary: Create a write-scoped empty secret with the caller's initial read ACL
      security: [{ consumerMtls: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentSecretRequest" }
      responses:
        "201": { $ref: "#/components/responses/ControlRevision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets/{secretId}:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Read an agent-authorized payload within its read path scope
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200": { $ref: "#/components/responses/AgentSecretRead" }
        "304": { description: The control revision is unchanged. }
        default: { $ref: "#/components/responses/Error" }
    put:
      servers: [*consumer-server]
      tags: [agent]
      summary: Update allowed metadata without altering ACLs
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentSecretRequest" }
      responses:
        "200": { $ref: "#/components/responses/ControlRevision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets/{secretId}/control:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Read agent-visible control metadata and an ETag without payload or ACL
      security: [{ consumerMtls: [] }]
      parameters: [{ $ref: "#/components/parameters/SecretId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentControl" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets/{secretId}/payload:
    put:
      servers: [*consumer-server]
      tags: [agent]
      summary: Replace a write-scoped payload
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayloadRequest" }
      responses:
        "200": { $ref: "#/components/responses/ControlRevision" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    administratorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    consumerMtls:
      type: mutualTLS
    bootstrapCapability:
      type: apiKey
      in: header
      name: Authorization
      description: Exact `Bootstrap hmlb_…` one-use capability; never an administrator JWT.
  parameters:
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    ApiFingerprint:
      name: apiFingerprint
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, pattern: "^grant-[a-z0-9-]{3,80}$" }
    Environment:
      name: environment
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PathPrefix:
      name: pathPrefix
      in: query
      schema:
        {
          type: string,
          maxLength: 256,
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$",
        }
    FolderPath:
      name: path
      in: query
      required: true
      schema:
        {
          type: string,
          maxLength: 256,
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$",
        }
    Tags:
      name: tags
      in: query
      description: Comma-separated exact-match key:value terms, combined with AND.
      schema: { type: string, maxLength: 2600 }
    SearchQuery:
      name: q
      in: query
      description: |
        Case-insensitive substring match against secretId and
        metadata.description, composed with environment/pathPrefix/tags. When
        present, the response is a bounded complete-or-truncated page instead
        of the usual cursor-paginated one; see SecretCatalogPage.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    ControlRevision:
      description: Current control revision
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ControlRevision" }
    AgentSecretRead:
      description: Decrypted payload allowed by the active AgentGrant
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SecretReadResponse" }
    Error:
      description: Safe application error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
    EnvironmentDefinition:
      type: object
      required: [name, createdAt, createdBy]
      properties:
        name: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
    EnvironmentListResponse:
      type: object
      required: [environments, generatedAt]
      properties:
        environments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EnvironmentDefinition" }
        generatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [eventId, at, correlationId, outcome, actor, operation]
      properties:
        eventId: { type: string }
        at: { type: string, format: date-time }
        correlationId: { type: string }
        outcome:
          { type: string, enum: [attempted, authorized, succeeded, failed] }
        actor: { $ref: "#/components/schemas/Actor" }
        operation: { type: string }
        target:
          type: object
          additionalProperties: { type: string }
        permission: { type: string, enum: [read] }
        sourceIp: { type: string }
        reasonCode: { type: string }
    AuditPage:
      type: object
      required: [date, events, generatedAt]
      properties:
        date: { type: string, format: date }
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    CreateFolderRequest:
      type: object
      required: [environment, path]
      properties:
        environment: { type: string, minLength: 1, maxLength: 128 }
        path:
          type: string
          maxLength: 256
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$"
    FolderDefinition:
      type: object
      required: [environment, path, createdAt, createdBy]
      properties:
        environment: { type: string }
        path: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
    CreateSecretRequest:
      type: object
      required: [secretId, environment, metadata, acl]
      properties:
        secretId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 40,
            items: { $ref: "#/components/schemas/Grant" },
          }
    UpdateSecretRequest:
      type: object
      properties:
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 40,
            items: { $ref: "#/components/schemas/Grant" },
          }
    Metadata:
      type: object
      properties:
        description: { type: string, maxLength: 1024 }
        path:
          type: string
          maxLength: 256
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$"
        tags:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 128
    Grant:
      type: object
      required: [consumerId, permissions]
      properties:
        consumerId: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [read] }
    Payload:
      type: object
      additionalProperties:
        type: object
        required: [encoding, value]
        properties:
          encoding: { type: string, enum: [utf8, base64] }
          value: { type: string }
    ControlRevision:
      type: object
      required:
        [
          schemaVersion,
          secretId,
          controlVersionId,
          environment,
          state,
          createdAt,
          createdBy,
          metadata,
          acl,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount:
          {
            type: integer,
            minimum: 0,
            description: Number of payload entries; plaintext names are not retained.,
          }
        environment: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [human, consumer, system] }
        id: { type: string }
        email:
          type: string
          format: email
          description: Optional point-in-time email display claim for an administrator.
        tenantId: { type: string }
        consumerId: { type: string }
        environment: { type: string }
    SecretReadResponse:
      type: object
      required: [secretId, controlVersionId, payloadVersionId, payload]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payload: { $ref: "#/components/schemas/Payload" }
    Change:
      type: object
      required: [secretId, controlVersionId, state, changeKind]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        changeKind: { type: string, enum: [secret.changed, secret.revoked] }
    ChangesResponse:
      type: object
      required: [changes, generatedAt]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    SecretCatalogEntry:
      type: object
      required: [secretId, environment, controlVersionId, state, metadata]
      properties:
        secretId: { type: string }
        environment: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer, minimum: 0 }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        updatedAt: { type: string, format: date-time }
    SecretCatalogPage:
      type: object
      required: [secrets, generatedAt]
      properties:
        secrets:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretCatalogEntry" },
          }
        nextCursor:
          {
            type: string,
            description: Absent when the request included q; a search page is bounded-complete instead of cursor-paginated.,
          }
        truncated:
          {
            type: boolean,
            description: Present only when the request included q; true means the internal search scan hit its bound.,
          }
        generatedAt: { type: string, format: date-time }
    SecretTreeFolder:
      type: object
      required: [segment, path, secretCount, kind]
      properties:
        segment:
          {
            type: string,
            description: Immediate path segment below pathPrefix.,
          }
        path:
          { type: string, description: Full path of this folder from the root. }
        secretCount:
          {
            type: integer,
            minimum: 0,
            description: Count of READY secrets anywhere in this folder's subtree.,
          }
        kind:
          type: string
          enum: [explicit, derived, both]
          description: |
            "explicit" -- an administrator created a folder record
            (POST /v1/admin/folders) at exactly this path and no secret
            currently implies it; secretCount is then 0. "derived" -- no
            folder record exists at exactly this path; it appears only
            because a secret's metadata.path equals or nests beneath it, or
            because a deeper explicit record implies it. "both" -- an
            explicit record exists at exactly this path and secretCount is
            greater than zero.
    SecretTreePage:
      type: object
      required: [environment, folders, secrets, truncated, generatedAt]
      properties:
        environment: { type: string }
        pathPrefix:
          { type: string, description: Echoed back; absent at the root. }
        folders:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretTreeFolder" },
          }
        secrets:
          {
            type: array,
            description: Only secrets whose path equals pathPrefix exactly (or,
            at the root,
            secrets with no path).,
            items: { $ref: "#/components/schemas/SecretCatalogEntry" },
          }
        truncated:
          {
            type: boolean,
            description: True when the internal scan stopped at its bound; the tree below is incomplete rather than paginated.,
          }
        generatedAt: { type: string, format: date-time }
    ConsumerSummary:
      type: object
      required: [consumerId, environment, status, subjectUri, createdAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, FAILED] }
        subjectUri: { type: string }
        createdAt: { type: string, format: date-time }
    ConsumerListPage:
      type: object
      required: [consumers, generatedAt]
      properties:
        consumers:
          {
            type: array,
            items: { $ref: "#/components/schemas/ConsumerSummary" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    ConsumerDetail:
      allOf:
        - $ref: "#/components/schemas/ConsumerSummary"
        - type: object
          required: [createdBy, activeApiIdentityCount]
          properties:
            createdBy: { $ref: "#/components/schemas/Actor" }
            activeApiIdentityCount: { type: integer, minimum: 0 }
            rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
    ApiIdentityDetail:
      type: object
      required: [apiFingerprint, status, kind, notBefore, notAfter]
      properties:
        apiFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        status:
          { type: string, enum: [PENDING, ACTIVE, REVOKED, EXPIRED, FAILED] }
        kind: { type: string, enum: [api, notify] }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        apiCertificatePem:
          {
            type: string,
            description: Public PEM for the issued leaf; never a private key.,
          }
    ApiIdentityListPage:
      type: object
      required: [consumerId, environment, apiIdentities, generatedAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        apiIdentities:
          {
            type: array,
            items: { $ref: "#/components/schemas/ApiIdentityDetail" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    TruststoreStatus:
      type: object
      required: [objectKey, versionId, anchorCount]
      properties:
        objectKey: { type: string }
        versionId: { type: string }
        anchorCount: { type: integer, minimum: 0 }
    IssuerStatus:
      type: object
      required:
        [rootFingerprint, rootCertificatePem, notBefore, notAfter, createdAt]
      properties:
        rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        rootCertificatePem: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        truststore: { $ref: "#/components/schemas/TruststoreStatus" }
    SecretRevision:
      type: object
      required:
        [controlVersionId, createdAt, createdBy, isCurrent, objectAvailable]
      properties:
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        isCurrent: { type: boolean }
        objectAvailable:
          {
            type: boolean,
            description: True only when the historical immutable S3 object was committed and has not been deleted by retention.,
          }
    SecretRevisionPage:
      type: object
      required: [secretId, revisions, truncated, generatedAt]
      properties:
        secretId: { type: string }
        revisions:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretRevision" },
          }
        truncated: { type: boolean }
        generatedAt: { type: string, format: date-time }
    EnrollmentRequest:
      type: object
      required: [consumerId, environment, apiCertificateSigningRequestPem]
      properties:
        consumerId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string, minLength: 1, maxLength: 128 }
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ApiIdentityRequest:
      type: object
      required: [apiCertificateSigningRequestPem]
      properties:
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ConsumerProvisioningResult:
      type: object
      required:
        [
          consumerId,
          environment,
          rootFingerprint,
          apiFingerprint,
          apiCertificatePem,
          status,
        ]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE] }
    CreateAgentGrantRequest:
      type: object
      required: [consumerId, environment, capabilities]
      properties:
        consumerId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string, minLength: 1, maxLength: 128 }
        capabilities:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [read, write] }
        readPathPrefixes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            {
              type: string,
              pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$",
            }
        writePathPrefixes:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            {
              type: string,
              pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$",
            }
        displayName: { type: string, minLength: 1, maxLength: 256 }
    AgentGrant:
      type: object
      required:
        [
          grantId,
          consumerId,
          environment,
          capabilities,
          readPathPrefixes,
          writePathPrefixes,
          status,
          createdAt,
        ]
      properties:
        grantId: { type: string }
        consumerId: { type: string }
        environment: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [read, write] }
        readPathPrefixes: { type: array, items: { type: string } }
        writePathPrefixes: { type: array, items: { type: string } }
        displayName: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE] }
        createdAt: { type: string, format: date-time }
    BootstrapCapability:
      type: object
      required: [grantId, token, expiresAt]
      properties:
        grantId: { type: string }
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    BootstrapRedemptionRequest:
      type: object
      required: [apiCertificateSigningRequestPem]
      properties:
        apiCertificateSigningRequestPem: { type: string, maxLength: 16384 }
    AgentBootstrapResult:
      allOf:
        - $ref: "#/components/schemas/ConsumerProvisioningResult"
        - type: object
          required: [grant]
          properties:
            grant:
              type: object
              required:
                [
                  grantId,
                  consumerId,
                  environment,
                  capabilities,
                  readPathPrefixes,
                  writePathPrefixes,
                ]
              properties:
                grantId: { type: string }
                consumerId: { type: string }
                environment: { type: string }
                capabilities:
                  { type: array, items: { type: string, enum: [read, write] } }
                readPathPrefixes: { type: array, items: { type: string } }
                writePathPrefixes: { type: array, items: { type: string } }
    AgentConfig:
      type: object
      required: [consumerId, environment, grant, mqtt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        grant:
          type: object
          required: [grantId, capabilities, readPathPrefixes, writePathPrefixes]
          properties:
            grantId: { type: string }
            capabilities:
              { type: array, items: { type: string, enum: [read, write] } }
            readPathPrefixes: { type: array, items: { type: string } }
            writePathPrefixes: { type: array, items: { type: string } }
        mqtt:
          type: object
          required: [endpoint, clientId, topic]
          properties:
            endpoint: { type: string }
            clientId: { type: string }
            topic: { type: string }
    CreateAgentSecretRequest:
      type: object
      required: [secretId, metadata]
      properties:
        secretId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        metadata: { $ref: "#/components/schemas/Metadata" }
    UpdateAgentSecretRequest:
      type: object
      required: [metadata]
      properties:
        metadata: { $ref: "#/components/schemas/Metadata" }
    AgentControl:
      type: object
      required: [secretId, environment, controlVersionId, state, metadata]
      properties:
        secretId: { type: string }
        environment: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        metadata: { $ref: "#/components/schemas/Metadata" }
    ApiIdentityResult:
      type: object
      required: [consumerId, environment, apiFingerprint, status]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable failure code. `enrollment_failed` is a
                terminal truststore publication failure and must not be
                retried; `conflict` on an administrator mutation means the
                idempotency key was already used and the outcome must be
                reconciled by re-reading the resource.
              enum:
                [
                  bad_request,
                  forbidden,
                  not_found,
                  conflict,
                  enrollment_failed,
                  precondition_failed,
                  internal_error,
                  service_unavailable,
                ]
            message: { type: string }
            correlationId: { type: string }
