openapi: 3.1.0
info:
  title: Hemlig Secrets Delivery API
  version: 0.5.0
  description: |
    Lambda/S3/KMS backed delivery of externally managed secret payloads.
    This contract includes secret control, organizational browsing, and enrolled
    identity certificate lifecycle routes and bounded audit-archive browsing.
    Issuer-root rotation remains intentionally absent.
externalDocs:
  description: Hemlig API reference and compatibility notes
  url: https://zyno-io.github.io/hemlig/reference/api/
servers:
  - &admin-server
    url: https://{adminFqdn}
    description: Administrator API; JWT required for every operation.
    variables:
      adminFqdn:
        default: admin.example.com
  - &consumer-server
    url: https://{apiFqdn}
    description: Delivery API; mTLS identity required for every operation.
    variables:
      apiFqdn:
        default: api.example.com
tags:
  - name: administrator
    description: Authenticated secret-control mutations.
  - name: consumer
    description: mTLS-authenticated secret delivery and reconciliation.
  - name: agent
    description: mTLS namespace-agent bootstrap, scoped synchronization, and delivery.
  - name: pki-admin
    description: PKI CA lifecycle, CRLs and root CRL upload.
paths:
  /v1/bootstrap/redeem:
    post:
      servers: [*admin-server]
      tags: [agent]
      summary: Redeem a one-use bootstrap capability for its pre-scoped AgentGrant
      security: [{ bootstrapCapability: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BootstrapRedemptionRequest" }
      responses:
        "201":
          description: Active mTLS leaf and AgentGrant scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentBootstrapResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/environments:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: List administrator-defined secret and consumer environments
      security: [{ administratorJwt: [] }]
      responses:
        "200":
          description: Environments available for new secrets and consumer enrollment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentListResponse" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Define an environment for secrets and consumer enrollment
      security: [{ administratorJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnvironmentRequest" }
      responses:
        "201":
          description: Newly defined environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentDefinition" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/audit:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse one UTC day of immutable application audit evidence
      description: |
        Returns up to fifty records in newest-first order. `date` defaults to
        the current UTC day. Supplying `secretId` returns only records whose
        safe target ID exactly matches it. Cursors are opaque, caller- and
        filter-bound, and valid for 15 minutes. Querying the archive does not
        write audit events.
      security: [{ administratorJwt: [] }]
      parameters:
        - name: date
          in: query
          required: false
          schema:
            { type: string, format: date, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: secretId
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        - name: environment
          in: query
          required: false
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
      responses:
        "200":
          description: Bounded immutable evidence page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/agent-grants:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create a pending exact-secret AgentGrant for a new consumer identity
      security: [{ administratorJwt: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgentGrantRequest" }
      responses:
        "201":
          description: Pending AgentGrant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGrant" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/agent-grants/{grantId}/bootstrap-capabilities:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Issue the one plaintext bootstrap capability for a pending grant
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/GrantId"
      responses:
        "201":
          description: Capability shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapCapability" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/agent-grants/{grantId}:
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Update the exact-secret policy of an existing AgentGrant without replacing its identity
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/GrantId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentGrantRequest" }
      responses:
        "200":
          description: Updated AgentGrant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentGrant" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/secrets:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse active or explicitly archived secret metadata by environment, path prefix, and exact tags
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/PathPrefix"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Archived"
      responses:
        "200":
          description: Paginated organizational catalog; never includes payloads or ACLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretCatalogPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create an empty secret and its initial ACL
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read secret control metadata and ACL without loading a payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Environment"
      responses:
        "200":
          $ref: "#/components/responses/AdminControlRevision"
        default:
          $ref: "#/components/responses/Error"
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Update metadata and/or ACL without decrypting the payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretRequest"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/archive:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Archive a secret, revoke its grants, and release its secret ID for reuse
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/archived-secrets/{secretUid}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read one archived secret by immutable UID
      description: The old secret ID is reusable after archival, so archive details are intentionally addressed by secretUid.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretUid"
        - $ref: "#/components/parameters/Environment"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/tree:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse the secret catalog as a folder tree below one path prefix
      description: |
        This route paginates the catalog-path index internally and returns one
        bounded page: the distinct immediate child folders below
        pathPrefix (each with a recursive secret count), derived from
        slash-separated secret IDs, plus any secrets that live directly at
        pathPrefix.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/PathPrefix"
        - $ref: "#/components/parameters/Archived"
      responses:
        "200":
          description: One bounded, complete-or-truncated tree page; never a cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretTreePage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse consumers in one environment
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated consumer directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerListPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Enroll a consumer CSR and receive an API client certificate
      description: Hemlig creates one deployment-wide issuing root, publishes that root to the mTLS truststore, and signs the CSR's public key with a client-auth leaf containing the consumer SPIFFE URI SAN.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "201":
          description: Active enrollment after API Gateway confirms the version-pinned truststore
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ConsumerProvisioningResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read one consumer profile and active API identity count
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
      responses:
        "200":
          description: Consumer management profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerDetail" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/grants:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse every current secret ACL grant held by one consumer
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated effective secret access grants; durable revocation tombstones are omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerSecretGrantPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/grants/{secretId}:
    delete:
      servers: [*admin-server]
      tags: [administrator]
      summary: Revoke one consumer's secret ACL grant
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/api-identities:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse a consumer's public API identity certificates
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated newest-first API identity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityListPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Sign an overlapping API client-certificate CSR
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiIdentityRequest" }
      responses:
        "201":
          description: Active API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/api-identities/{apiFingerprint}:
    delete:
      servers: [*admin-server]
      tags: [administrator]
      summary: Revoke an API leaf identity immediately
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/ApiFingerprint"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/payload:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Decrypt and read the current secret payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Environment"
      responses:
        "200":
          description: Current decrypted payload and immutable revision IDs
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretReadResponse" }
        default:
          $ref: "#/components/responses/Error"
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create a fresh encrypted payload and control revision
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/Payload"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/revisions:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read newest-first secret control revision history without payloads
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/Environment"
      responses:
        "200":
          description: At most 500 newest control revisions; no payload or object URL is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretRevisionPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/issuer:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read public issuing-root and current truststore status
      security: [{ administratorJwt: [] }]
      responses:
        "200":
          description: Public issuer status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Deliberately provision the Hemlig issuing root before any consumer enrolls
      description: |
        The issuing root is otherwise created lazily inside the first
        enrollment. This route lets an operator provision it deliberately so
        the truststore anchor exists and can be distributed in advance. It
        shares its creation logic with the lazy enrollment path, so the two
        can never diverge, and creation is race-safe: calling this
        repeatedly or concurrently is safe without an additional lock.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The issuing root already existed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        "201":
          description: This call created the issuing root
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets/{secretId}:
    get:
      servers: [*consumer-server]
      tags: [consumer]
      summary: Read an authorized payload over mTLS
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Decrypted payload
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretReadResponse" }
        "304":
          description: The control revision is unchanged.
          headers:
            ETag:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /v1/changes:
    get:
      servers: [*consumer-server]
      tags: [consumer]
      summary: Return the caller consumer's current paginated access snapshot
      security: [{ consumerMtls: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current change page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        default:
          $ref: "#/components/responses/Error"
  /v1/agent/config:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Return the active AgentGrant and exact private AWS IoT topic
      security: [{ consumerMtls: [] }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfig" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/identities/rotate:
    post:
      servers: [*consumer-server]
      tags: [agent]
      summary: Replace the calling agent mTLS identity with a leaf for a new key
      description: |
        The caller must hold an ACTIVE API identity and an active AgentGrant.
        The CSR must use a new key. Each identity may have one active
        successor, and a consumer may hold at most three active API identities.
        Retrying with the same Idempotency-Key and CSR returns the same leaf and
        re-registers it with IoT Core.
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiIdentityRequest" }
      responses:
        "201":
          description: New active API identity; the caller's identity stays valid until it expires or is revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentIdentityRotation" }
        "400":
          description: invalid_csr for any CSR-content problem, otherwise bad_request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: identity_not_active (certificate unknown, revoked, or expired) or forbidden (no active agent grant)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: identity_limit_reached, identity_already_rotated, identity_rotation_conflict (retry with the same idempotency key), rotation_replay_inactive, or conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/sync:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Synchronize scoped secret versions after a completed checkpoint
      description: |
        Omit both cursors for an initial current-state snapshot. Pass syncCursor
        for changes after a completed synchronization, or cursor to continue a
        page. The arguments are mutually exclusive. Intermediate revisions can
        coalesce; this is current-state convergence rather than an event log.
        Active write-only and empty grants can synchronize. Read entries still
        require the current read ACL. Metadata is returned only for write scope.
      security: [{ consumerMtls: [] }]
      parameters:
        - name: syncCursor
          in: query
          description: Opaque caller/scope-bound checkpoint, valid for seven days
          schema: { type: string }
        - name: cursor
          in: query
          description: Opaque page continuation, valid for the fifteen-minute sync cycle
          schema: { type: string }
      responses:
        "200":
          description: Scoped current configuration and version changes; never a payload or ACL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentSyncPage" }
        "410":
          description: sync_reset_required; discard the checkpoint and start a snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "503":
          description: sync_index_not_ready until backfill completes, or transient service failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets/{secretId}:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Read an agent-authorized payload within its read path scope
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200": { $ref: "#/components/responses/AgentSecretRead" }
        "304": { description: The control revision is unchanged. }
        default: { $ref: "#/components/responses/Error" }
    put:
      servers: [*consumer-server]
      tags: [agent]
      summary: Update allowed metadata without altering ACLs
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentSecretRequest" }
      responses:
        "200": { $ref: "#/components/responses/ControlRevision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets/{secretId}/control:
    get:
      servers: [*consumer-server]
      tags: [agent]
      summary: Read agent-visible control metadata and an ETag without payload or ACL
      security: [{ consumerMtls: [] }]
      parameters: [{ $ref: "#/components/parameters/SecretId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentControl" }
        default: { $ref: "#/components/responses/Error" }
  /v1/agent/secrets/{secretId}/payload:
    put:
      servers: [*consumer-server]
      tags: [agent]
      summary: Replace a write-scoped payload
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayloadRequest" }
      responses:
        "200": { $ref: "#/components/responses/ControlRevision" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/cas:
    get:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: List the CAs of one environment
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiEnvironment"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Up to 100 CAs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkiCaListPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Create an externally signed intermediate CA and its CSR
      description: Requires the configured PKI CA administrator role when one is set.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PkiCreateCaRequest" }
      responses:
        "201":
          description: The pending CA and its CSR
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkiCreateCaResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/cas/{caId}:
    get:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Read one CA
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
      responses:
        "200": { $ref: "#/components/responses/PkiCaDetail" }
        default: { $ref: "#/components/responses/Error" }
    put:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Replace a CA's display name and policy
      description: Allowed for PENDING_CERTIFICATE and ACTIVE CAs. Policy fields that are omitted keep their current value.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PkiUpdateCaRequest" }
      responses:
        "200": { $ref: "#/components/responses/PkiCaDetail" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Abandon a pending CA (marks it FAILED and destroys its key)
      description: The CA name and subject claims are kept.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/PkiCaDetail" }
        "412": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/cas/{caId}/certificate:
    post:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Activate a CA with the certificate its external root signed
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PkiActivateCaRequest" }
      responses:
        "200": { $ref: "#/components/responses/PkiCaDetail" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/cas/{caId}/retire:
    post:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Retire an active CA
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/PkiCaDetail" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/cas/{caId}/destroy-key:
    post:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Destroy the wrapped key of a CA whose key is DISABLED
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { $ref: "#/components/responses/PkiCaDetail" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/cas/{caId}/crl:
    post:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Publish a fresh CRL for a CA now
      description: Requires the configured PKI operator role when one is set.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCaId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The CRL now published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkiCrlPublishResponse" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/crls/{id}:
    get:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Download the current DER CRL of a CA or an external root
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiCrlIssuerId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The DER CRL
          headers:
            ETag:
              schema: { type: string }
          content:
            application/pkix-crl:
              schema: { type: string, contentMediaType: application/pkix-crl }
        "304":
          description: The CRL is unchanged
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/external-cas:
    get:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: List external root CAs
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Up to 100 external CAs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkiExternalCaListPage" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/external-cas/{extId}:
    get:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Read one external root CA
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiExtId"
      responses:
        "200":
          description: The external CA
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkiExternalCaDetail" }
        default: { $ref: "#/components/responses/Error" }
  /v1/admin/pki/external-cas/{extId}/crl:
    post:
      servers: [*admin-server]
      tags: [pki-admin]
      summary: Upload a newer CRL of an external root
      description: Dependent CAs the CRL revokes are revoked before the CRL becomes current.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/PkiExtId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PkiUploadCrlRequest" }
      responses:
        "200":
          description: The stored CRL and the CAs it revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkiUploadCrlResponse" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    administratorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    consumerMtls:
      type: mutualTLS
    bootstrapCapability:
      type: apiKey
      in: header
      name: Authorization
      description: Exact `Bootstrap hmlb_…` one-use capability; never an administrator JWT.
  parameters:
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    ApiFingerprint:
      name: apiFingerprint
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string, pattern: "^grant-[a-z0-9-]{3,80}$" }
    Environment:
      name: environment
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PathPrefix:
      name: pathPrefix
      in: query
      schema:
        {
          type: string,
          maxLength: 256,
          pattern: "^[a-z][a-z0-9-]{2,63}(/[a-z][a-z0-9-]{2,63})*$",
        }
    Tags:
      name: tags
      in: query
      description: Comma-separated exact-match key:value terms, combined with AND.
      schema: { type: string, maxLength: 2600 }
    SearchQuery:
      name: q
      in: query
      description: |
        Case-insensitive substring match against secretId and
        metadata.description, composed with environment/pathPrefix/tags. When
        present, the response is a bounded complete-or-truncated page instead
        of the usual cursor-paginated one; see SecretCatalogPage.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Archived:
      name: archived
      in: query
      description: Set to true to query archived secrets. Omit it (or set false) to query only active catalog entries.
      schema: { type: boolean, default: false }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      allowReserved: true
      schema:
        {
          type: string,
          maxLength: 256,
          pattern: "^[a-z][a-z0-9-]{2,63}(/[a-z][a-z0-9-]{2,63})*$",
        }
    SecretUid:
      name: secretUid
      in: path
      required: true
      schema: { type: string, pattern: "^sec-[a-z0-9-]{3,127}$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    PkiCaId:
      name: caId
      in: path
      required: true
      schema: { type: string, pattern: "^ca-[a-z0-9-]{3,80}$" }
    PkiExtId:
      name: extId
      in: path
      required: true
      schema: { type: string, pattern: "^ext-[0-9a-f]{40}$" }
    PkiCrlIssuerId:
      name: id
      in: path
      required: true
      schema:
        { type: string, pattern: "^(ca-[a-z0-9-]{3,80}|ext-[0-9a-f]{40})$" }
    PkiEnvironment:
      name: environment
      in: query
      required: true
      schema: { type: string, maxLength: 128 }
  responses:
    PkiCaDetail:
      description: The CA
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PkiCaDetail" }
    ControlRevision:
      description: Current control revision
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ControlRevision" }
    AdminControlRevision:
      description: >-
        Current control revision, with the read-only agentManagedConsumerIds
        field. Only this route returns it.
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ControlRevision"
              - type: object
                properties:
                  agentManagedConsumerIds:
                    type: array
                    description: >-
                      Consumer IDs in acl that have an AgentGrant. Their rows
                      are managed by the grant. Derived, never stored.
                    items: { type: string }
    AgentSecretRead:
      description: Decrypted payload allowed by the active AgentGrant
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SecretReadResponse" }
    Error:
      description: Safe application error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{0,63}$" }
    EnvironmentDefinition:
      type: object
      required: [name, createdAt, createdBy]
      properties:
        name: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
    EnvironmentListResponse:
      type: object
      required: [environments, generatedAt]
      properties:
        environments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EnvironmentDefinition" }
        generatedAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [eventId, at, correlationId, outcome, actor, operation]
      properties:
        eventId: { type: string }
        at: { type: string, format: date-time }
        correlationId: { type: string }
        outcome:
          { type: string, enum: [attempted, authorized, succeeded, failed] }
        actor: { $ref: "#/components/schemas/Actor" }
        operation: { type: string }
        target:
          type: object
          additionalProperties: { type: string }
        permission: { type: string, enum: [read] }
        sourceIp: { type: string }
        reasonCode: { type: string }
    AuditPage:
      type: object
      required: [date, events, generatedAt]
      properties:
        date: { type: string, format: date }
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AuditEvent" }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    CreateSecretRequest:
      type: object
      required: [secretId, environment, metadata, acl]
      properties:
        secretId:
          {
            type: string,
            maxLength: 256,
            pattern: "^[a-z][a-z0-9-]{2,63}(/[a-z][a-z0-9-]{2,63})*$",
          }
        environment: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 40,
            items: { $ref: "#/components/schemas/Grant" },
          }
    UpdateSecretRequest:
      type: object
      properties:
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 40,
            items: { $ref: "#/components/schemas/Grant" },
          }
        preserveAgentAcl:
          type: boolean
          description: >-
            When true, prior ACL rows for consumers that have an AgentGrant
            and are omitted from acl are kept (appended after the submitted
            rows, in prior order). When false or absent, omitting one is
            rejected with 409. Adding or changing an agent row is always 409.
            The change is also rejected with 400 if the prior and new ACLs
            together name more than 90 distinct consumers.
    Metadata:
      type: object
      properties:
        description: { type: string, maxLength: 1024 }
        tags:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 128
    Grant:
      type: object
      required: [consumerId, permissions]
      properties:
        consumerId: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [read] }
    Payload:
      type: object
      additionalProperties:
        type: object
        required: [encoding, value]
        properties:
          encoding: { type: string, enum: [utf8, base64] }
          value: { type: string }
    ControlRevision:
      type: object
      required:
        [
          schemaVersion,
          secretUid,
          secretId,
          controlVersionId,
          environment,
          state,
          createdAt,
          createdBy,
          metadata,
          acl,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        secretUid: { type: string }
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount:
          {
            type: integer,
            minimum: 0,
            description: Number of payload entries; plaintext names are not retained.,
          }
        environment: { type: string }
        state:
          { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED, ARCHIVED] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [human, consumer, system] }
        id: { type: string }
        email:
          type: string
          format: email
          description: Optional point-in-time email display claim for an administrator.
        tenantId: { type: string }
        consumerId: { type: string }
        environment: { type: string }
    SecretReadResponse:
      type: object
      required: [secretId, controlVersionId, payloadVersionId, payload]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payload: { $ref: "#/components/schemas/Payload" }
    Change:
      type: object
      required: [secretId, controlVersionId, state, changeKind]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        changeKind: { type: string, enum: [secret.changed, secret.revoked] }
    ChangesResponse:
      type: object
      required: [changes, generatedAt]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    SecretCatalogEntry:
      type: object
      required:
        [secretUid, secretId, environment, controlVersionId, state, metadata]
      properties:
        secretUid: { type: string }
        secretId: { type: string }
        environment: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer, minimum: 0 }
        state:
          { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED, ARCHIVED] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        updatedAt: { type: string, format: date-time }
    SecretCatalogPage:
      type: object
      required: [secrets, generatedAt]
      properties:
        secrets:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretCatalogEntry" },
          }
        nextCursor:
          {
            type: string,
            description: Absent when the request included q; a search page is bounded-complete instead of cursor-paginated.,
          }
        truncated:
          {
            type: boolean,
            description: Present only when the request included q; true means the internal search scan hit its bound.,
          }
        generatedAt: { type: string, format: date-time }
    SecretTreeFolder:
      type: object
      required: [segment, path, secretCount, kind]
      properties:
        segment:
          {
            type: string,
            description: Immediate path segment below pathPrefix.,
          }
        path:
          { type: string, description: Full path of this folder from the root. }
        secretCount:
          {
            type: integer,
            minimum: 0,
            description: Count of READY secrets anywhere in this folder's subtree.,
          }
        kind:
          type: string
          enum: [derived]
          description: Derived from slash-separated secret IDs; empty folders do not exist.
    SecretTreePage:
      type: object
      required: [environment, folders, secrets, truncated, generatedAt]
      properties:
        environment: { type: string }
        pathPrefix:
          { type: string, description: Echoed back; absent at the root. }
        folders:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretTreeFolder" },
          }
        secrets:
          {
            type: array,
            description: Only secrets whose path equals pathPrefix exactly (or,
            at the root,
            secrets with no path).,
            items: { $ref: "#/components/schemas/SecretCatalogEntry" },
          }
        truncated:
          {
            type: boolean,
            description: True when the internal scan stopped at its bound; the tree below is incomplete rather than paginated.,
          }
        generatedAt: { type: string, format: date-time }
    ConsumerSummary:
      type: object
      required: [consumerId, environment, status, subjectUri, createdAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, FAILED] }
        subjectUri: { type: string }
        createdAt: { type: string, format: date-time }
    ConsumerListPage:
      type: object
      required: [consumers, generatedAt]
      properties:
        consumers:
          {
            type: array,
            items: { $ref: "#/components/schemas/ConsumerSummary" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    ConsumerDetail:
      allOf:
        - $ref: "#/components/schemas/ConsumerSummary"
        - type: object
          required: [createdBy, activeApiIdentityCount]
          properties:
            createdBy: { $ref: "#/components/schemas/Actor" }
            activeApiIdentityCount: { type: integer, minimum: 0 }
            rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
            agentGrant: { $ref: "#/components/schemas/AgentGrant" }
    ConsumerSecretGrant:
      type: object
      required: [secretUid, secretId, permissions, controlVersionId, state]
      properties:
        secretUid: { type: string, pattern: "^sec-[a-z0-9-]{3,127}$" }
        secretId: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [read] }
        controlVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE] }
    ConsumerSecretGrantPage:
      type: object
      required: [consumerId, environment, grants, generatedAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        grants:
          type: array
          items: { $ref: "#/components/schemas/ConsumerSecretGrant" }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    ApiIdentityDetail:
      type: object
      required: [apiFingerprint, status, kind, notBefore, notAfter]
      properties:
        apiFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        status:
          { type: string, enum: [PENDING, ACTIVE, REVOKED, EXPIRED, FAILED] }
        kind: { type: string, enum: [api, notify] }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        apiCertificatePem:
          {
            type: string,
            description: Public PEM for the issued leaf; never a private key.,
          }
    ApiIdentityListPage:
      type: object
      required: [consumerId, environment, apiIdentities, generatedAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        apiIdentities:
          {
            type: array,
            items: { $ref: "#/components/schemas/ApiIdentityDetail" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    TruststoreStatus:
      type: object
      required: [objectKey, versionId, anchorCount]
      properties:
        objectKey: { type: string }
        versionId: { type: string }
        anchorCount: { type: integer, minimum: 0 }
    IssuerStatus:
      type: object
      required:
        [rootFingerprint, rootCertificatePem, notBefore, notAfter, createdAt]
      properties:
        rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        rootCertificatePem: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        truststore: { $ref: "#/components/schemas/TruststoreStatus" }
    SecretRevision:
      type: object
      required:
        [controlVersionId, createdAt, createdBy, isCurrent, objectAvailable]
      properties:
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        isCurrent: { type: boolean }
        objectAvailable:
          {
            type: boolean,
            description: True only when the historical immutable S3 object was committed and has not been deleted by retention.,
          }
    SecretRevisionPage:
      type: object
      required: [secretId, revisions, truncated, generatedAt]
      properties:
        secretId: { type: string }
        revisions:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretRevision" },
          }
        truncated: { type: boolean }
        generatedAt: { type: string, format: date-time }
    EnrollmentRequest:
      type: object
      required: [consumerId, environment, apiCertificateSigningRequestPem]
      properties:
        consumerId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string, minLength: 1, maxLength: 128 }
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ApiIdentityRequest:
      type: object
      required: [apiCertificateSigningRequestPem]
      properties:
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ConsumerProvisioningResult:
      type: object
      required:
        [
          consumerId,
          environment,
          rootFingerprint,
          apiFingerprint,
          apiCertificatePem,
          status,
        ]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE] }
    AgentIdentityRotation:
      allOf:
        - $ref: "#/components/schemas/ConsumerProvisioningResult"
        - type: object
          required: [notBefore, notAfter]
          properties:
            notBefore: { type: string, format: date-time }
            notAfter: { type: string, format: date-time }
    CreateAgentGrantRequest:
      type: object
      required: [consumerId, environment, capabilities, secretGrants]
      properties:
        consumerId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string, minLength: 1, maxLength: 128 }
        capabilities:
          type: array
          maxItems: 2
          uniqueItems: true
          description: |
            Empty only together with an empty `secretGrants`, for an agent
            with no secret access (a PKI-only agent). Otherwise one or more.
          items: { type: string, enum: [read, write] }
        secretGrants:
          type: array
          maxItems: 20
          uniqueItems: true
          description: |
            Empty only together with an empty `capabilities`. Otherwise one
            or more.
          items: { $ref: "#/components/schemas/AgentSecretGrantRequest" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
      oneOf:
        - properties:
            { capabilities: { maxItems: 0 }, secretGrants: { maxItems: 0 } }
        - properties:
            { capabilities: { minItems: 1 }, secretGrants: { minItems: 1 } }
    AgentSecretGrantRequest:
      type: object
      required: [secretId, permissions]
      properties:
        secretId:
          type: string
          pattern: "^[a-z][a-z0-9-]{2,63}(/[a-z][a-z0-9-]{2,63})*$"
        permissions:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [read, write] }
    AgentSecretGrant:
      type: object
      required: [secretId, secretUid, permissions]
      properties:
        secretId: { type: string }
        secretUid: { type: string, pattern: "^sec-[a-z0-9-]{3,127}$" }
        permissions:
          type: array
          items: { type: string, enum: [read, write] }
    AgentGrant:
      type: object
      required:
        [
          grantId,
          consumerId,
          environment,
          capabilities,
          secretGrants,
          status,
          createdAt,
        ]
      properties:
        grantId: { type: string }
        consumerId: { type: string }
        environment: { type: string }
        capabilities:
          type: array
          items: { type: string, enum: [read, write] }
        secretGrants:
          type: array
          items: { $ref: "#/components/schemas/AgentSecretGrant" }
        displayName: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE] }
        createdAt: { type: string, format: date-time }
    UpdateAgentGrantRequest:
      type: object
      required: [capabilities, secretGrants]
      properties:
        capabilities:
          type: array
          maxItems: 2
          uniqueItems: true
          items: { type: string, enum: [read, write] }
        secretGrants:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { $ref: "#/components/schemas/AgentSecretGrantRequest" }
        displayName: { type: string, minLength: 1, maxLength: 256 }
    BootstrapCapability:
      type: object
      required: [grantId, token, expiresAt]
      properties:
        grantId: { type: string }
        token: { type: string, writeOnly: true }
        expiresAt: { type: string, format: date-time }
    BootstrapRedemptionRequest:
      type: object
      required: [apiCertificateSigningRequestPem]
      properties:
        apiCertificateSigningRequestPem: { type: string, maxLength: 16384 }
    AgentBootstrapResult:
      allOf:
        - $ref: "#/components/schemas/ConsumerProvisioningResult"
        - type: object
          required: [grant]
          properties:
            grant:
              type: object
              required:
                [grantId, consumerId, environment, capabilities, secretGrants]
              properties:
                grantId: { type: string }
                consumerId: { type: string }
                environment: { type: string }
                capabilities:
                  { type: array, items: { type: string, enum: [read, write] } }
                secretGrants:
                  type: array
                  items: { $ref: "#/components/schemas/AgentSecretGrant" }
                readSecretIds:
                  type: array
                  deprecated: true
                  items: { type: string }
                readSecretUids:
                  type: array
                  deprecated: true
                  items: { type: string }
                writeSecretIds:
                  type: array
                  deprecated: true
                  items: { type: string }
                writeSecretUids:
                  type: array
                  deprecated: true
                  items: { type: string }
    AgentConfig:
      type: object
      required: [consumerId, environment, grant, mqtt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        grant:
          type: object
          required: [grantId, capabilities, secretGrants]
          properties:
            grantId: { type: string }
            capabilities:
              { type: array, items: { type: string, enum: [read, write] } }
            secretGrants:
              type: array
              items: { $ref: "#/components/schemas/AgentSecretGrant" }
            readSecretIds:
              type: array
              deprecated: true
              items: { type: string }
            readSecretUids:
              type: array
              deprecated: true
              items: { type: string }
            writeSecretIds:
              type: array
              deprecated: true
              items: { type: string }
            writeSecretUids:
              type: array
              deprecated: true
              items: { type: string }
        mqtt:
          type: object
          required: [endpoint, clientId, topic]
          properties:
            endpoint: { type: string }
            clientId: { type: string }
            topic: { type: string }
    UpdateAgentSecretRequest:
      type: object
      required: [metadata]
      properties:
        metadata: { $ref: "#/components/schemas/Metadata" }
    PayloadRequest:
      type: object
      required: [payload]
      properties:
        payload: { $ref: "#/components/schemas/Payload" }
    AgentControl:
      type: object
      required: [secretId, environment, controlVersionId, state, metadata]
      properties:
        secretId: { type: string }
        environment: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        metadata: { $ref: "#/components/schemas/Metadata" }
    AgentSyncEntry:
      type: object
      required: [secretUid, secretId, controlVersionId, state, permissions]
      properties:
        secretUid: { type: string }
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        permissions:
          type: array
          items: { type: string, enum: [read, write] }
        metadata:
          description: Present only with effective write permission
          allOf: [{ $ref: "#/components/schemas/Metadata" }]
    AgentSyncPage:
      type: object
      required: [config, snapshot, changes]
      properties:
        config: { $ref: "#/components/schemas/AgentConfig" }
        snapshot: { type: boolean }
        changes:
          type: array
          items: { $ref: "#/components/schemas/AgentSyncEntry" }
        nextCursor:
          type: string
          description: Continue this range; no completed checkpoint is issued yet
        syncCursor:
          type: string
          description: Present on the final page; persist only after successfully applying this sync
    ApiIdentityResult:
      type: object
      required: [consumerId, environment, apiFingerprint, status]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
    PkiCaSubject:
      type: object
      additionalProperties: false
      required: [commonName]
      properties:
        commonName: { type: string, pattern: '^[\x20-\x7e]+$', maxLength: 64 }
        organization: { type: string, pattern: '^[\x20-\x7e]+$', maxLength: 64 }
        organizationalUnit:
          { type: string, pattern: '^[\x20-\x7e]+$', maxLength: 64 }
        country: { type: string, pattern: '^[\x20-\x7e]+$', maxLength: 64 }
        locality: { type: string, pattern: '^[\x20-\x7e]+$', maxLength: 64 }
        state: { type: string, pattern: '^[\x20-\x7e]+$', maxLength: 64 }
    PkiNameSubtrees:
      type: object
      additionalProperties: false
      properties:
        dns: { type: array, items: { type: string } }
        ip: { type: array, items: { type: string } }
        uri: { type: array, items: { type: string } }
    PkiNameConstraints:
      type: object
      additionalProperties: false
      properties:
        permitted: { $ref: "#/components/schemas/PkiNameSubtrees" }
        excluded: { $ref: "#/components/schemas/PkiNameSubtrees" }
    PkiRequestedConstraints:
      type: object
      additionalProperties: false
      properties:
        nameConstraints: { $ref: "#/components/schemas/PkiNameConstraints" }
        extendedKeyUsages:
          type: array
          items: { type: string, enum: [serverAuth, clientAuth] }
    PkiCaPolicyInput:
      type: object
      additionalProperties: false
      properties:
        maxLeafLifetimeSeconds:
          { type: integer, minimum: 300, maximum: 34300800 }
        leafKeyAlgorithms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              [
                ECDSA_P256,
                ECDSA_P384,
                ECDSA_P521,
                ED25519,
                RSA_2048,
                RSA_3072,
                RSA_4096,
                RSA_8192,
              ]
        capacity: { type: integer, minimum: 1, maximum: 12000 }
        issuancePerHour: { type: integer, minimum: 1, maximum: 6000 }
        crlValiditySeconds: { type: integer, minimum: 3600, maximum: 2592000 }
    PkiCaPolicy:
      type: object
      required:
        [
          issueLeaves,
          issueSubordinates,
          maxLeafLifetimeSeconds,
          leafKeyAlgorithms,
          capacity,
          issuancePerHour,
          crlValiditySeconds,
        ]
      properties:
        issueLeaves: { type: boolean }
        issueSubordinates: { type: boolean }
        maxLeafLifetimeSeconds: { type: integer }
        leafKeyAlgorithms: { type: array, items: { type: string } }
        capacity: { type: integer }
        issuancePerHour: { type: integer }
        crlValiditySeconds: { type: integer }
    PkiCreateCaRequest:
      type: object
      additionalProperties: false
      required: [environment, name, kind, keyAlgorithm, subject]
      properties:
        environment: { type: string, maxLength: 128 }
        name: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        kind: { type: string, enum: [EXTERNAL_INTERMEDIATE] }
        keyAlgorithm:
          type: string
          enum: [ECDSA_P256, ECDSA_P384, RSA_3072, RSA_4096, ED25519]
        subject: { $ref: "#/components/schemas/PkiCaSubject" }
        requestedConstraints:
          { $ref: "#/components/schemas/PkiRequestedConstraints" }
        policy: { $ref: "#/components/schemas/PkiCaPolicyInput" }
        crl:
          type: object
          additionalProperties: false
          properties:
            validitySeconds: { type: integer, minimum: 3600, maximum: 2592000 }
        displayName: { type: string, minLength: 1, maxLength: 128 }
    PkiUpdateCaRequest:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        displayName:
          {
            type: [string, "null"],
            minLength: 1,
            maxLength: 128,
            description: "Omit to keep the stored name; null clears it.",
          }
        policy: { $ref: "#/components/schemas/PkiCaPolicyInput" }
    PkiActivateCaRequest:
      type: object
      additionalProperties: false
      required: [certificatePem, chainPem]
      properties:
        certificatePem: { type: string, minLength: 1, maxLength: 32768 }
        chainPem: { type: string, minLength: 1, maxLength: 32768 }
        rootCrl:
          type: string
          minLength: 1
          description: PEM (`X509 CRL`) or base64 DER.
        acceptBroaderConstraints: { type: boolean }
    PkiUploadCrlRequest:
      type: object
      additionalProperties: false
      required: [crl]
      properties:
        crl:
          type: string
          minLength: 1
          description: PEM (`X509 CRL`) or base64 DER.
    PkiWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    PkiCrlView:
      type: object
      required:
        [
          number,
          thisUpdate,
          nextUpdate,
          entryCount,
          sha256,
          revision,
          pendingRevocations,
          state,
        ]
      properties:
        number: { type: integer }
        thisUpdate: { type: string, format: date-time }
        nextUpdate: { type: string, format: date-time }
        entryCount: { type: integer }
        sha256: { type: string }
        revision: { type: integer }
        pendingRevocations: { type: integer, minimum: 0 }
        dirtySince: { type: string, format: date-time }
        state: { type: string, enum: [MISSING, STALE, CURRENT] }
    PkiRootCrlView:
      type: object
      required: [extId, state]
      properties:
        extId: { type: string }
        state: { type: string, enum: [MISSING, CURRENT, STALE] }
        numberHex: { type: string }
        thisUpdate: { type: string, format: date-time }
        nextUpdate: { type: string, format: date-time }
    PkiCaSummary:
      type: object
      required:
        [
          caId,
          environment,
          name,
          kind,
          status,
          version,
          keyAlgorithm,
          keyState,
          createdAt,
        ]
      properties:
        caId: { type: string }
        environment: { type: string }
        name: { type: string }
        displayName: { type: string }
        kind: { type: string }
        status:
          type: string
          enum: [PENDING_CERTIFICATE, ACTIVE, RETIRED, REVOKED, FAILED]
        version: { type: string }
        keyAlgorithm: { type: string }
        keyState: { type: string, enum: [ACTIVE, DISABLED, DESTROYED] }
        fingerprint: { type: string }
        notAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    PkiCaDetail:
      allOf:
        - $ref: "#/components/schemas/PkiCaSummary"
        - type: object
          required:
            [
              key,
              subject,
              subjectDn,
              requestedConstraints,
              crlIssuers,
              policy,
              maxIssueLifetimeEverSeconds,
              createdBy,
              drained,
            ]
          properties:
            key:
              type: object
              required: [custody, algorithm, spkiSha256, state]
              properties:
                custody: { type: string }
                algorithm: { type: string }
                spkiSha256: { type: string }
                state: { type: string }
            subject: { $ref: "#/components/schemas/PkiCaSubject" }
            subjectDn: { type: string }
            requestedConstraints:
              { $ref: "#/components/schemas/PkiRequestedConstraints" }
            effectiveConstraints:
              type: object
              description: Constraints in force; extended key usages not named serverAuth or clientAuth appear as OIDs.
              additionalProperties: true
            acceptBroaderConstraints: { type: boolean }
            csrPem: { type: string }
            certificatePem: { type: string }
            chainPem: { type: string }
            serial: { type: string }
            notBefore: { type: string, format: date-time }
            parent:
              type: object
              properties:
                type: { type: string, enum: [ca, external] }
                id: { type: string }
            crlIssuers:
              {
                type: array,
                items: { type: object, additionalProperties: true },
              }
            policy: { $ref: "#/components/schemas/PkiCaPolicy" }
            maxIssueLifetimeEverSeconds: { type: integer }
            createdBy: { type: object, additionalProperties: true }
            activatedAt: { type: string, format: date-time }
            retiredAt: { type: string, format: date-time }
            revokedAt: { type: string, format: date-time }
            revocationReason: { type: string }
            revocationSource: { type: string, enum: [EXTERNAL, HEMLIG] }
            revocationEvidence: { type: string }
            drained: { type: boolean }
            drainAt: { type: string, format: date-time }
            crl: { $ref: "#/components/schemas/PkiCrlView" }
            rootCrl: { $ref: "#/components/schemas/PkiRootCrlView" }
            warnings:
              {
                type: array,
                items: { $ref: "#/components/schemas/PkiWarning" },
              }
    PkiCreateCaResponse:
      allOf:
        - $ref: "#/components/schemas/PkiCaDetail"
        - type: object
          required: [csrPem]
          properties:
            csrPem: { type: string }
    PkiCaListPage:
      type: object
      required: [cas, generatedAt]
      properties:
        cas:
          { type: array, items: { $ref: "#/components/schemas/PkiCaSummary" } }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    PkiCrlPublishResponse:
      type: object
      required: [caId, crl]
      properties:
        caId: { type: string }
        crl: { $ref: "#/components/schemas/PkiCrlView" }
    PkiExternalCaSummary:
      type: object
      required:
        [
          extId,
          fingerprint,
          spkiSha256,
          subjectDn,
          subjectKeyIdentifier,
          notAfter,
          dependents,
          environments,
          version,
          createdAt,
          crlState,
        ]
      properties:
        extId: { type: string }
        fingerprint: { type: string }
        spkiSha256: { type: string }
        subjectDn: { type: string }
        subjectKeyIdentifier: { type: string }
        notAfter: { type: string, format: date-time }
        dependents: { type: array, items: { type: string } }
        environments: { type: array, items: { type: string } }
        version: { type: string }
        createdAt: { type: string, format: date-time }
        crl:
          type: object
          properties:
            numberHex: { type: string }
            thisUpdate: { type: string, format: date-time }
            nextUpdate: { type: string, format: date-time }
            sha256: { type: string }
            uploadedAt: { type: string, format: date-time }
        crlState: { type: string, enum: [MISSING, CURRENT, STALE] }
    PkiExternalCaDetail:
      allOf:
        - $ref: "#/components/schemas/PkiExternalCaSummary"
        - type: object
          required: [certificatePem]
          properties:
            certificatePem: { type: string }
    PkiExternalCaListPage:
      type: object
      required: [externalCas, generatedAt]
      properties:
        externalCas:
          {
            type: array,
            items: { $ref: "#/components/schemas/PkiExternalCaSummary" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    PkiUploadCrlResponse:
      type: object
      required: [extId, changed, revokedCaIds]
      properties:
        extId: { type: string }
        crl: { type: object, additionalProperties: true }
        changed: { type: boolean }
        revokedCaIds: { type: array, items: { type: string } }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable failure code. `enrollment_failed` is a
                terminal truststore publication failure and must not be
                retried; `conflict` on an administrator mutation means the
                idempotency key was already used and the outcome must be
                reconciled by re-reading the resource. `identity_not_active`
                (403) means the presented client certificate is unknown,
                revoked, or expired; `invalid_csr` (400) is any CSR-content
                problem on identity rotation. PKI administration adds
                `chain_invalid`, `crl_invalid` (400) and `crl_not_newer`,
                `ca_subject_in_use`, `ca_not_active`, `ca_key_unavailable`,
                `ca_issuance_budget_exceeded` (409); each carries
                `details.reason`. `conflict` reasons: `name_in_use`,
                `ca_not_pending`, `key_not_disabled`, `key_destroyed`,
                `ca_limit_reached`. `bad_request` reasons:
                `kind_not_supported`, `invalid_name_constraint`,
                `reserved_name`, `invalid_policy`, `body_too_large`,
                `unknown_field`. `forbidden` with reason `pki_role_required`
                names the missing role in `details.role`.
              enum:
                [
                  bad_request,
                  forbidden,
                  identity_not_active,
                  invalid_csr,
                  not_found,
                  conflict,
                  identity_limit_reached,
                  identity_already_rotated,
                  identity_rotation_conflict,
                  rotation_replay_inactive,
                  enrollment_failed,
                  precondition_failed,
                  chain_invalid,
                  crl_invalid,
                  crl_not_newer,
                  ca_subject_in_use,
                  ca_not_active,
                  ca_key_unavailable,
                  ca_issuance_budget_exceeded,
                  internal_error,
                  service_unavailable,
                ]
            message: { type: string }
            correlationId: { type: string }
            details:
              type: object
              description: Optional safe, non-secret fields that qualify the error, such as a stable `reason`.
              additionalProperties: { type: [string, number, boolean] }
