openapi: 3.1.0
info:
  title: Hemlig Secrets Delivery API
  version: 0.3.0
  description: |
    Lambda/S3/KMS backed delivery of externally managed secret payloads.
    This contract includes secret control, organizational browsing, and enrolled
    identity certificate lifecycle routes. Audit query and issuer-root rotation are
    intentionally absent.
externalDocs:
  description: Hemlig API reference and compatibility notes
  url: ../docs/api.md
servers:
  - &admin-server
    url: https://{adminFqdn}
    description: Administrator API; JWT required for every operation.
    variables:
      adminFqdn:
        default: admin.example.com
  - &consumer-server
    url: https://{apiFqdn}
    description: Delivery API; mTLS identity required for every operation.
    variables:
      apiFqdn:
        default: api.example.com
tags:
  - name: administrator
    description: Authenticated secret-control mutations.
  - name: consumer
    description: mTLS-authenticated secret delivery and reconciliation.
paths:
  /v1/admin/secrets:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse secret control metadata by environment, path prefix, and exact tags
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/PathPrefix"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated organizational catalog; never includes payloads or ACLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretCatalogPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create an empty secret and its initial ACL
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read secret control metadata and ACL without loading a payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Update metadata and/or ACL without decrypting the payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretRequest"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse consumers in one environment
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated consumer directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerListPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Enroll a consumer CSR and receive an API client certificate
      description: Hemlig creates one deployment-wide issuing root, publishes that root to the mTLS truststore, and signs the CSR's public key with a client-auth leaf containing the consumer SPIFFE URI SAN.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "201":
          description: Active enrollment after API Gateway confirms the version-pinned truststore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerProvisioningResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read one consumer profile and active API identity count
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
      responses:
        "200":
          description: Consumer management profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerDetail" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/api-identities:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse a consumer's public API identity certificates
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated newest-first API identity page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityListPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Sign an overlapping API client-certificate CSR
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiIdentityRequest" }
      responses:
        "201":
          description: Active API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/consumers/{consumerId}/api-identities/{apiFingerprint}:
    delete:
      servers: [*admin-server]
      tags: [administrator]
      summary: Revoke an API leaf identity immediately
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ConsumerId"
        - $ref: "#/components/parameters/ApiFingerprint"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/payload:
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create a fresh encrypted payload and control revision
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/Payload"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/revisions:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read newest-first secret control revision history without payloads
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          description: At most 500 newest control revisions; no payload or object URL is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretRevisionPage" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/issuer:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read public issuing-root and current truststore status
      security: [{ administratorJwt: [] }]
      responses:
        "200":
          description: Public issuer status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuerStatus" }
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets/{secretId}:
    get:
      servers: [*consumer-server]
      tags: [consumer]
      summary: Read an authorized payload over mTLS
      security: [{ consumerMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Decrypted payload
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretReadResponse" }
        "304":
          description: The control revision is unchanged.
          headers:
            ETag:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /v1/changes:
    get:
      servers: [*consumer-server]
      tags: [consumer]
      summary: Return the caller consumer's current paginated access snapshot
      security: [{ consumerMtls: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current change page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    administratorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    consumerMtls:
      type: mutualTLS
  parameters:
    ConsumerId:
      name: consumerId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    ApiFingerprint:
      name: apiFingerprint
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    Environment:
      name: environment
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PathPrefix:
      name: pathPrefix
      in: query
      schema:
        {
          type: string,
          maxLength: 256,
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$",
        }
    Tags:
      name: tags
      in: query
      description: Comma-separated exact-match key:value terms, combined with AND.
      schema: { type: string, maxLength: 2600 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    ControlRevision:
      description: Current control revision
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ControlRevision" }
    Error:
      description: Safe application error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    CreateSecretRequest:
      type: object
      required: [environment, metadata, acl]
      properties:
        secretId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 10,
            items: { $ref: "#/components/schemas/Grant" },
          }
    UpdateSecretRequest:
      type: object
      properties:
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 10,
            items: { $ref: "#/components/schemas/Grant" },
          }
    Metadata:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        path:
          type: string
          maxLength: 256
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$"
        tags:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 128
    Grant:
      type: object
      required: [consumerId, permissions]
      properties:
        consumerId: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [read] }
    Payload:
      type: object
      additionalProperties:
        type: object
        required: [encoding, value]
        properties:
          encoding: { type: string, enum: [utf8, base64] }
          value: { type: string }
    ControlRevision:
      type: object
      required:
        [
          schemaVersion,
          secretId,
          controlVersionId,
          environment,
          state,
          createdAt,
          createdBy,
          metadata,
          acl,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount:
          {
            type: integer,
            minimum: 0,
            description: Number of payload entries; plaintext names are not retained.,
          }
        environment: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [human, consumer, system] }
        id: { type: string }
        tenantId: { type: string }
        consumerId: { type: string }
        environment: { type: string }
    SecretReadResponse:
      type: object
      required: [secretId, controlVersionId, payloadVersionId, payload]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payload: { $ref: "#/components/schemas/Payload" }
    Change:
      type: object
      required: [secretId, controlVersionId, state, changeKind]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        changeKind: { type: string, enum: [secret.changed, secret.revoked] }
    ChangesResponse:
      type: object
      required: [changes, generatedAt]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    SecretCatalogEntry:
      type: object
      required: [secretId, environment, controlVersionId, state, metadata]
      properties:
        secretId: { type: string }
        environment: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer, minimum: 0 }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        updatedAt: { type: string, format: date-time }
    SecretCatalogPage:
      type: object
      required: [secrets, generatedAt]
      properties:
        secrets:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretCatalogEntry" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    ConsumerSummary:
      type: object
      required: [consumerId, environment, status, subjectUri, createdAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, FAILED] }
        subjectUri: { type: string }
        createdAt: { type: string, format: date-time }
    ConsumerListPage:
      type: object
      required: [consumers, generatedAt]
      properties:
        consumers:
          {
            type: array,
            items: { $ref: "#/components/schemas/ConsumerSummary" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    ConsumerDetail:
      allOf:
        - $ref: "#/components/schemas/ConsumerSummary"
        - type: object
          required: [createdBy, activeApiIdentityCount]
          properties:
            createdBy: { $ref: "#/components/schemas/Actor" }
            activeApiIdentityCount: { type: integer, minimum: 0 }
            rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
    ApiIdentityDetail:
      type: object
      required: [apiFingerprint, status, kind, notBefore, notAfter]
      properties:
        apiFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        status:
          { type: string, enum: [PENDING, ACTIVE, REVOKED, EXPIRED, FAILED] }
        kind: { type: string, enum: [api, notify] }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        apiCertificatePem:
          {
            type: string,
            description: Public PEM for the issued leaf; never a private key.,
          }
    ApiIdentityListPage:
      type: object
      required: [consumerId, environment, apiIdentities, generatedAt]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        apiIdentities:
          {
            type: array,
            items: { $ref: "#/components/schemas/ApiIdentityDetail" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    TruststoreStatus:
      type: object
      required: [objectKey, versionId, anchorCount]
      properties:
        objectKey: { type: string }
        versionId: { type: string }
        anchorCount: { type: integer, minimum: 0 }
    IssuerStatus:
      type: object
      required:
        [rootFingerprint, rootCertificatePem, notBefore, notAfter, createdAt]
      properties:
        rootFingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
        rootCertificatePem: { type: string }
        notBefore: { type: string, format: date-time }
        notAfter: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        truststore: { $ref: "#/components/schemas/TruststoreStatus" }
    SecretRevision:
      type: object
      required:
        [controlVersionId, createdAt, createdBy, isCurrent, objectAvailable]
      properties:
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payloadKeyCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        isCurrent: { type: boolean }
        objectAvailable:
          {
            type: boolean,
            description: True only when the historical immutable S3 object was committed and has not been deleted by retention.,
          }
    SecretRevisionPage:
      type: object
      required: [secretId, revisions, truncated, generatedAt]
      properties:
        secretId: { type: string }
        revisions:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretRevision" },
          }
        truncated: { type: boolean }
        generatedAt: { type: string, format: date-time }
    EnrollmentRequest:
      type: object
      required: [consumerId, environment, apiCertificateSigningRequestPem]
      properties:
        consumerId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string, minLength: 1, maxLength: 128 }
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ApiIdentityRequest:
      type: object
      required: [apiCertificateSigningRequestPem]
      properties:
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ConsumerProvisioningResult:
      type: object
      required:
        [
          consumerId,
          environment,
          rootFingerprint,
          apiFingerprint,
          apiCertificatePem,
          status,
        ]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE] }
    ApiIdentityResult:
      type: object
      required: [consumerId, environment, apiFingerprint, status]
      properties:
        consumerId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
              description: |
                Stable machine-readable failure code. `enrollment_failed` is a
                terminal truststore publication failure and must not be
                retried; `conflict` on an administrator mutation means the
                idempotency key was already used and the outcome must be
                reconciled by re-reading the resource.
              enum:
                [
                  bad_request,
                  forbidden,
                  not_found,
                  conflict,
                  enrollment_failed,
                  precondition_failed,
                  internal_error,
                  service_unavailable,
                ]
            message: { type: string }
            correlationId: { type: string }
