openapi: 3.1.0
info:
  title: Clavis Cluster Secrets API
  version: 0.2.0
  description: |
    Lambda/S3/KMS backed delivery of externally managed Kubernetes Secret payloads.
    This contract includes secret control, organizational browsing, and cluster
    enrollment/certificate lifecycle routes. Audit query and issuer-root rotation are
    intentionally absent.
externalDocs:
  description: Clavis API reference and compatibility notes
  url: ../docs/api.md
servers:
  - &admin-server
    url: https://{adminFqdn}
    description: Administrator API; JWT required for every operation.
    variables:
      adminFqdn:
        default: admin.example.com
  - &cluster-server
    url: https://{clusterFqdn}
    description: Cluster API; mTLS identity required for every operation.
    variables:
      clusterFqdn:
        default: clusters.example.com
tags:
  - name: administrator
    description: Authenticated secret-control mutations.
  - name: cluster
    description: mTLS-authenticated secret delivery and reconciliation.
paths:
  /v1/admin/secrets:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Browse secret control metadata by environment, path prefix, and exact tags
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/PathPrefix"
        - $ref: "#/components/parameters/Tags"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Paginated organizational catalog; never includes payloads or ACLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretCatalogPage" }
        default:
          $ref: "#/components/responses/Error"
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create an empty secret and its initial ACL
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecretRequest"
      responses:
        "201":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}:
    get:
      servers: [*admin-server]
      tags: [administrator]
      summary: Read secret control metadata and ACL without loading a payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Update metadata and/or ACL without decrypting the payload
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSecretRequest"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/clusters:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Enroll a cluster CSR and receive an API client certificate
      description: Clavis creates one deployment-wide issuing root, publishes that root to the mTLS truststore, and signs the CSR's public key with a client-auth leaf containing the cluster SPIFFE URI SAN.
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentRequest" }
      responses:
        "201":
          description: Active enrollment after API Gateway confirms the version-pinned truststore
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterProvisioningResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/clusters/{clusterId}/api-identities:
    post:
      servers: [*admin-server]
      tags: [administrator]
      summary: Sign an overlapping API client-certificate CSR
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiIdentityRequest" }
      responses:
        "201":
          description: Active API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/clusters/{clusterId}/api-identities/{apiFingerprint}:
    delete:
      servers: [*admin-server]
      tags: [administrator]
      summary: Revoke an API leaf identity immediately
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/ClusterId"
        - $ref: "#/components/parameters/ApiFingerprint"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked API identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiIdentityResult" }
        default:
          $ref: "#/components/responses/Error"
  /v1/admin/secrets/{secretId}/payload:
    put:
      servers: [*admin-server]
      tags: [administrator]
      summary: Create a fresh encrypted payload and control revision
      security: [{ administratorJwt: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  $ref: "#/components/schemas/Payload"
      responses:
        "200":
          $ref: "#/components/responses/ControlRevision"
        default:
          $ref: "#/components/responses/Error"
  /v1/secrets/{secretId}:
    get:
      servers: [*cluster-server]
      tags: [cluster]
      summary: Read an authorized payload over mTLS
      security: [{ clusterMtls: [] }]
      parameters:
        - $ref: "#/components/parameters/SecretId"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Decrypted payload
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretReadResponse" }
        "304":
          description: The control revision is unchanged.
          headers:
            ETag:
              schema: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /v1/changes:
    get:
      servers: [*cluster-server]
      tags: [cluster]
      summary: Return the caller cluster's current paginated access snapshot
      security: [{ clusterMtls: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Current change page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    administratorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    clusterMtls:
      type: mutualTLS
  parameters:
    ClusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    ApiFingerprint:
      name: apiFingerprint
      in: path
      required: true
      schema: { type: string, pattern: "^[a-f0-9]{64}$" }
    Environment:
      name: environment
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PathPrefix:
      name: pathPrefix
      in: query
      schema:
        {
          type: string,
          maxLength: 256,
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$",
        }
    Tags:
      name: tags
      in: query
      description: Comma-separated exact-match key:value terms, combined with AND.
      schema: { type: string, maxLength: 2600 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    SecretId:
      name: secretId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    ControlRevision:
      description: Current control revision
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ControlRevision" }
    Error:
      description: Safe application error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    CreateSecretRequest:
      type: object
      required: [environment, metadata, acl]
      properties:
        secretId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 10,
            items: { $ref: "#/components/schemas/Grant" },
          }
    UpdateSecretRequest:
      type: object
      properties:
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl:
          {
            type: array,
            maxItems: 10,
            items: { $ref: "#/components/schemas/Grant" },
          }
    Metadata:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        path:
          type: string
          maxLength: 256
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$"
        tags:
          type: object
          maxProperties: 20
          additionalProperties:
            type: string
            maxLength: 128
    Grant:
      type: object
      required: [clusterId, permissions]
      properties:
        clusterId: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [read] }
    Payload:
      type: object
      additionalProperties:
        type: object
        required: [encoding, value]
        properties:
          encoding: { type: string, enum: [utf8, base64] }
          value: { type: string }
    ControlRevision:
      type: object
      required:
        [
          schemaVersion,
          secretId,
          controlVersionId,
          environment,
          state,
          createdAt,
          createdBy,
          metadata,
          acl,
        ]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        environment: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }
        metadata: { $ref: "#/components/schemas/Metadata" }
        acl: { type: array, items: { $ref: "#/components/schemas/Grant" } }
    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [human, cluster, system] }
        id: { type: string }
        tenantId: { type: string }
        clusterId: { type: string }
        environment: { type: string }
    SecretReadResponse:
      type: object
      required: [secretId, controlVersionId, payloadVersionId, payload]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        payload: { $ref: "#/components/schemas/Payload" }
    Change:
      type: object
      required: [secretId, controlVersionId, state, changeKind]
      properties:
        secretId: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        changeKind: { type: string, enum: [secret.changed, secret.revoked] }
    ChangesResponse:
      type: object
      required: [changes, generatedAt]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/Change" } }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    SecretCatalogEntry:
      type: object
      required: [secretId, environment, controlVersionId, state, metadata]
      properties:
        secretId: { type: string }
        environment: { type: string }
        controlVersionId: { type: string }
        payloadVersionId: { type: string }
        state: { type: string, enum: [PENDING_VALUE, ACTIVE, REVOKED] }
        metadata: { $ref: "#/components/schemas/Metadata" }
        updatedAt: { type: string, format: date-time }
    SecretCatalogPage:
      type: object
      required: [secrets, generatedAt]
      properties:
        secrets:
          {
            type: array,
            items: { $ref: "#/components/schemas/SecretCatalogEntry" },
          }
        nextCursor: { type: string }
        generatedAt: { type: string, format: date-time }
    EnrollmentRequest:
      type: object
      required: [clusterId, environment, apiCertificateSigningRequestPem]
      properties:
        clusterId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
        environment: { type: string, minLength: 1, maxLength: 128 }
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ApiIdentityRequest:
      type: object
      required: [apiCertificateSigningRequestPem]
      properties:
        apiCertificateSigningRequestPem: { type: string, maxLength: 32768 }
    ClusterProvisioningResult:
      type: object
      required:
        [clusterId, environment, rootFingerprint, apiFingerprint, apiCertificatePem, status]
      properties:
        clusterId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE] }
    ApiIdentityResult:
      type: object
      required: [clusterId, environment, apiFingerprint, status]
      properties:
        clusterId: { type: string }
        environment: { type: string }
        rootFingerprint: { type: string }
        apiFingerprint: { type: string }
        apiCertificatePem: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
