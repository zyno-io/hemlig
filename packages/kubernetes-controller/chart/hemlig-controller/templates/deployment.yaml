apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hemlig-controller.fullname" . }}
  labels:
    {{- include "hemlig-controller.labels" . | nindent 4 }}
spec:
  # The current controller does not implement leader election. The schema
  # deliberately accepts only one replica until that safety property ships.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "hemlig-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hemlig-controller.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hemlig-controller.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HEMLIG_RECONCILE_INTERVAL_MS
              value: {{ .Values.controller.reconcileIntervalMilliseconds | quote }}
            - name: HEMLIG_SOURCE_DEBOUNCE_MS
              value: {{ .Values.controller.sourceDebounceMilliseconds | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
