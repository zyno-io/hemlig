# Opt-in. Lets cert-manager's built-in approver approve CertificateRequests for
# Hemlig issuers; the IssuanceGrant is the authorization boundary. Apply it
# unless you gate requests with approver-policy. The subject must match the
# ServiceAccount your cert-manager runs as.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hemlig-controller-cert-manager-approver
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["signers"]
    verbs: ["approve"]
    resourceNames:
      - "hemligissuers.hemlig.zyno.io/*"
      - "hemligclusterissuers.hemlig.zyno.io/*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hemlig-controller-cert-manager-approver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hemlig-controller-cert-manager-approver
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
