apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hemligproviders.hemlig.io
spec:
  group: hemlig.io
  scope: Cluster
  names:
    plural: hemligproviders
    singular: hemligprovider
    kind: HemligProvider
    shortNames: [hmlprovider]
  versions:
    - name: v1beta1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [bootstrapUrl, apiUrl, allowedNamespaces]
              properties:
                bootstrapUrl: { type: string, pattern: "^https://[^/?#]+$" }
                apiUrl: { type: string, pattern: "^https://[^/?#]+$" }
                allowedNamespaces:
                  type: object
                  required: [matchLabels]
                  properties:
                    matchLabels:
                      type: object
                      minProperties: 1
                      additionalProperties: { type: string }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hemligconsumers.hemlig.io
spec:
  group: hemlig.io
  scope: Namespaced
  names:
    plural: hemligconsumers
    singular: hemligconsumer
    kind: HemligConsumer
    shortNames: [hmlconsumer]
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [providerRef, bootstrapTokenRef, identity]
              properties:
                providerRef: { type: string, minLength: 1 }
                allowCrossNamespaceReferences: { type: boolean }
                bootstrapTokenRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: { type: string, minLength: 1 }
                    key: { type: string, minLength: 1 }
                identity:
                  type: object
                  required: [secretName]
                  properties:
                    secretName: { type: string, minLength: 1 }
                    rotateBefore: { type: string, pattern: "^[0-9]+[smhd]$" }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hemligsecretimports.hemlig.io
spec:
  group: hemlig.io
  scope: Namespaced
  names:
    plural: hemligsecretimports
    singular: hemligsecretimport
    kind: HemligSecretImport
    shortNames: [hmlimport]
  versions:
    # v1alpha1 remains served for one migration release, but is not extended.
    - name: v1alpha1
      served: true
      storage: false
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1beta1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [consumerRef, secretId]
              properties:
                consumerRef: { type: string, minLength: 1 }
                consumerNamespace: { type: string, minLength: 1 }
                secretId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
                target:
                  type: object
                  properties:
                    name: { type: string, minLength: 1 }
                    type: { type: string, minLength: 1 }
                deletionPolicy: { type: string, enum: [Retain, Delete] }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hemligsecretexports.hemlig.io
spec:
  group: hemlig.io
  scope: Namespaced
  names:
    plural: hemligsecretexports
    singular: hemligsecretexport
    kind: HemligSecretExport
    shortNames: [hmlexport]
  versions:
    # v1alpha1 remains served for one migration release, but is not extended.
    - name: v1alpha1
      served: true
      storage: false
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
    - name: v1beta1
      served: true
      storage: true
      subresources: { status: {} }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [consumerRef, secretId, source, metadata]
              properties:
                consumerRef: { type: string, minLength: 1 }
                consumerNamespace: { type: string, minLength: 1 }
                secretId: { type: string, pattern: "^[a-z][a-z0-9-]{2,63}$" }
                source:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1 }
                metadata:
                  type: object
                  required: [path]
                  properties:
                    description: { type: string, maxLength: 1024 }
                    path:
                      type: string
                      maxLength: 256
                      pattern: "^[a-z0-9][a-z0-9._-]{0,63}(/[a-z0-9][a-z0-9._-]{0,63})*$"
                    tags:
                      type: object
                      maxProperties: 20
                      additionalProperties: { type: string, maxLength: 128 }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
