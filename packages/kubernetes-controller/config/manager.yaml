apiVersion: v1
kind: ServiceAccount
metadata:
  name: clavis-controller
  namespace: clavis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clavis-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["clavis.io"]
    resources: ["clavissecretimports", "clavissecretexports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["clavis.io"]
    resources: ["clavissecretimports/status", "clavissecretexports/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clavis-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clavis-controller
subjects:
  - kind: ServiceAccount
    name: clavis-controller
    namespace: clavis-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clavis-controller
  namespace: clavis-system
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: clavis-controller } }
  template:
    metadata: { labels: { app.kubernetes.io/name: clavis-controller } }
    spec:
      serviceAccountName: clavis-controller
      containers:
        - name: controller
          image: ghcr.io/clavis/kubernetes-controller:REPLACE_WITH_VERSION
          env:
            - name: CLAVIS_CLUSTER_URL
              value: https://clusters.example.com
            - name: CLAVIS_CLUSTER_TLS_SECRET
              value: clavis-client-tls
            - name: CLAVIS_ADMIN_URL
              value: https://admin.example.com
            - name: CLAVIS_ADMIN_TOKEN_FILE
              value: /var/run/secrets/clavis/admin-token
          volumeMounts:
            - name: admin-token
              mountPath: /var/run/secrets/clavis
              readOnly: true
      volumes:
        - name: admin-token
          secret:
            secretName: clavis-admin-token
