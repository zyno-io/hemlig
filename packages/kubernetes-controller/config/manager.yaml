# Broad, cluster-operator installation profile. The Helm chart's namespace
# profile is the least-privilege default; this raw manifest is for platforms
# that deliberately centralize Hemlig reconciliation in hemlig-system.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hemlig-controller
  namespace: hemlig-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hemlig-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hemlig.io"]
    resources: ["hemligproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hemlig.io"]
    resources: ["hemligconsumers", "hemligsecretimports", "hemligsecretexports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hemlig.io"]
    resources: ["hemligconsumers/status", "hemligsecretimports/status", "hemligsecretexports/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hemlig-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hemlig-controller
subjects:
  - kind: ServiceAccount
    name: hemlig-controller
    namespace: hemlig-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hemlig-controller
  namespace: hemlig-system
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: hemlig-controller } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hemlig-controller } }
    spec:
      serviceAccountName: hemlig-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: controller
          image: ghcr.io/hemlig/kubernetes-controller:REPLACE_WITH_VERSION
          env:
            - name: HEMLIG_RECONCILE_INTERVAL_MS
              value: "600000"
            - name: HEMLIG_SOURCE_DEBOUNCE_MS
              value: "250"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
