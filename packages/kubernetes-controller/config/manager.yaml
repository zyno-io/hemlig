apiVersion: v1
kind: ServiceAccount
metadata:
  name: hemlig-controller
  namespace: hemlig-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hemlig-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["hemlig.io"]
    resources: ["hemligsecretimports", "hemligsecretexports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hemlig.io"]
    resources: ["hemligsecretimports/status", "hemligsecretexports/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hemlig-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hemlig-controller
subjects:
  - kind: ServiceAccount
    name: hemlig-controller
    namespace: hemlig-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hemlig-controller
  namespace: hemlig-system
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: hemlig-controller } }
  template:
    metadata: { labels: { app.kubernetes.io/name: hemlig-controller } }
    spec:
      serviceAccountName: hemlig-controller
      containers:
        - name: controller
          image: ghcr.io/hemlig/kubernetes-controller:REPLACE_WITH_VERSION
          env:
            - name: HEMLIG_API_URL
              value: https://api.example.com
            - name: HEMLIG_CONSUMER_TLS_SECRET
              value: hemlig-client-tls
            - name: HEMLIG_ADMIN_URL
              value: https://admin.example.com
            - name: HEMLIG_ADMIN_TOKEN_FILE
              value: /var/run/secrets/hemlig/admin-token
          volumeMounts:
            - name: admin-token
              mountPath: /var/run/secrets/hemlig
              readOnly: true
      volumes:
        - name: admin-token
          secret:
            secretName: hemlig-admin-token
