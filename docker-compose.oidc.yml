# TEST-ONLY Keycloak for `yarn verify:oidc`. See src/scripts/verify-oidc.ts.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    volumes:
      - ./test/oidc/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro
